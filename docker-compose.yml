services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: ${COFOUNDER_DB_NAME:-cofounder_db}
      POSTGRES_USER: ${COFOUNDER_DB_USER:-dev}
      POSTGRES_PASSWORD: ${COFOUNDER_DB_PASSWORD:-devpassword}
    ports:
      - "127.0.0.1:${COFOUNDER_DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
