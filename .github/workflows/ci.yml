name: Application checks

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: cofounder_test
          POSTGRES_PASSWORD: local_ci_only
          POSTGRES_DB: cofounder_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cofounder_test -d cofounder_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    env:
      TEST_DATABASE_URL: postgresql://cofounder_test:local_ci_only@127.0.0.1:5432/cofounder_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: python -m pip install -r backend/requirements.txt
      - run: python -m pip check
      - run: python -m unittest discover -s backend/tests -v
      - run: python -m backend.contracts.tool --check --check-runtime

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend-vite
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend-vite/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build:live
